<style>
:root{
  --ink:#071E3D; --ink-2:#2B3B55; --muted:#5B6B82;
  --blue:#0A66FF; --blue-soft:#E8F0FF; --blue-line:#B9CFFB;
  --bg:#FFFFFF; --bg-alt:#F5F8FD; --line:#E2E8F2;
  --navy:#0B1F3F;
  --radius:18px;
  --max:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--blue)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:.78rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}
.kicker::before{content:"";width:28px;height:2px;background:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:600;font-size:1rem;text-decoration:none;border:0;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(10,102,255,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(10,102,255,.34)}
.btn-ghost{color:var(--ink);background:transparent;border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.nav .logo img{height:32px;width:auto}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.nav ul a{color:var(--ink-2);text-decoration:none;font-size:.95rem;font-weight:500}
.nav ul a:hover{color:var(--blue)}
.nav .btn{padding:10px 18px;font-size:.92rem}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#F7FAFF 0%,#FFFFFF 70%)}
.hero::before{content:"";position:absolute;right:-220px;top:-260px;width:720px;height:720px;border-radius:50%;background:radial-gradient(closest-side,#DCE8FF,rgba(220,232,255,0));pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:72px 88px}
.hero h1{font-size:clamp(2.2rem,3.9vw,3.25rem);font-weight:700;margin:22px 0 22px}
.hero h1 span{color:var(--blue)}
.hero .lead{font-size:1.18rem;color:var(--ink-2);max-width:34em}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero .note{margin-top:18px;font-size:.9rem;color:var(--muted)}
.journey{width:100%;height:auto;overflow:visible}
.visual{position:relative;min-width:0}
.chat{position:absolute;left:0;top:-6px;width:min(330px,62%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 40px rgba(7,30,61,.10);display:grid;gap:10px;z-index:2}
.msg{font-size:.86rem;line-height:1.45;padding:10px 12px;border-radius:14px}
.msg .who{display:block;font-size:.7rem;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.msg.in{background:var(--bg-alt);border-top-left-radius:4px;margin-right:24px}
.msg.out{background:var(--blue);color:#fff;border-top-right-radius:4px;margin-left:24px}
.msg.out .who{color:#CFE0FF}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.72rem;font-weight:600;color:#0E7A4C;background:#E7F8EF;border-radius:999px;padding:4px 9px}
.journey{margin-top:170px}

.journey .path{stroke-dasharray:2 9;stroke-linecap:round;animation:flow 22s linear infinite}
@keyframes flow{to{stroke-dashoffset:-440}}
.journey .node circle.ring{fill:#fff;stroke:var(--blue-line);stroke-width:1.5;filter:drop-shadow(0 6px 14px rgba(7,30,61,.10))}
.journey .label{font:600 13px Inter,system-ui,sans-serif;fill:var(--ink)}
.journey .pill{fill:#fff;stroke:var(--line)}
.journey .ico{fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.journey .pulse{fill:var(--blue)}
@media (prefers-reduced-motion:reduce){.journey .path{animation:none}.journey animateMotion{display:none}}

/* sections */
section{padding-block:96px}
.alt{background:var(--bg-alt)}
.sec-head{max-width:720px;margin-bottom:52px}
.sec-head h2{font-size:clamp(1.8rem,3.2vw,2.5rem);font-weight:700;margin-top:16px}
.sec-head p{margin-top:16px;color:var(--ink-2);font-size:1.08rem}

.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;min-width:0}
.card .ic{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;margin-bottom:18px}
.card .ic svg{width:24px;height:24px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.12rem;font-weight:600;margin-bottom:8px}
.card p{color:var(--muted);font-size:.97rem}
.card.wide{grid-column:span 3;display:flex;gap:22px;align-items:center;background:var(--navy);border-color:var(--navy);color:#fff}
.card.wide .ic{background:rgba(255,255,255,.08);margin:0;flex:none}
.card.wide .ic svg{stroke:#8DB6FF}
.card.wide p{color:#C5D3EA}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{position:relative;padding:30px 28px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);min-width:0}
.step .n{font-size:.78rem;font-weight:700;letter-spacing:.18em;color:var(--blue)}
.step h3{font-size:1.2rem;margin:12px 0 10px}
.step p{color:var(--muted)}
.step .time{display:inline-block;margin-top:16px;font-size:.82rem;font-weight:600;color:var(--ink-2);background:var(--bg-alt);border-radius:999px;padding:5px 12px}

.free{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.free h2{font-size:clamp(1.8rem,3.2vw,2.5rem);margin-top:16px}
.free .body p{color:var(--ink-2);font-size:1.06rem;margin-top:16px}
.flow{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:grid;gap:14px;min-width:0}
.flow .row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--bg-alt)}
.flow .row b{font-weight:600}
.flow .row span{color:var(--muted);font-size:.93rem}
.flow .dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:700;font-size:.9rem}
.flow .row.zero .dot{background:#12B76A}

.about{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:56px;align-items:center}
.band{position:relative;padding:0;min-height:440px;display:flex;align-items:center;overflow:hidden;background:#EEF3FC}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.7) 38%,rgba(255,255,255,0) 62%)}
.band-text{position:relative;z-index:1;width:100%;padding-block:64px}
.band .quote{max-width:520px;font-size:clamp(1.4rem,2.4vw,1.95rem);font-weight:600;line-height:1.3;color:var(--ink);text-wrap:balance}
.band .quote::before{content:"";display:block;width:44px;height:3px;background:var(--blue);margin-bottom:20px}

.day{background:linear-gradient(180deg,#0B1F3F 0%,#0A1730 100%);color:#fff;overflow:hidden}
.day .kicker{color:#8DB6FF}.day .kicker::before{background:#8DB6FF}
.day .sec-head p{color:#C5D3EA}
.sky{position:relative;height:120px;margin-bottom:8px;border-radius:20px;background:linear-gradient(90deg,#FFD9A0 0%,#9CC3FF 28%,#3F7BE0 55%,#1B3570 78%,#0E1D3E 100%);overflow:hidden}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sun{position:absolute;left:9%;top:34px;width:46px;height:46px;border-radius:50%;background:#FFF3D6;box-shadow:0 0 40px 14px rgba(255,220,150,.75)}
.moon{position:absolute;right:8%;top:30px;width:40px;height:40px;border-radius:50%;box-shadow:-10px 4px 0 0 #F5E7B8}
.sky::after{content:"";position:absolute;right:0;top:0;width:35%;height:100%;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 90% 25%,#fff,transparent);opacity:.8}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.timeline li{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px 18px;min-width:0}
.timeline li::before{content:"";position:absolute;top:-14px;left:22px;width:2px;height:14px;background:rgba(255,255,255,.35)}
.timeline time{display:inline-block;font-weight:700;font-size:1.05rem;color:#FFD9A0;font-variant-numeric:tabular-nums}
.timeline li.night time{color:#8DB6FF}
.timeline li.night{background:rgba(10,102,255,.14);border-color:rgba(141,182,255,.3)}
.timeline h3{font-size:1rem;margin:8px 0 6px}
.timeline p{font-size:.88rem;color:#C5D3EA;line-height:1.5}
.badge{background:var(--navy);border-radius:24px;padding:36px 32px;color:#fff;box-shadow:0 20px 50px rgba(7,30,61,.18)}
.badge img{height:34px;width:auto;margin-bottom:28px}
.badge ul{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.badge li{padding-top:16px;border-top:1px solid rgba(255,255,255,.12);color:#C5D3EA;font-size:.92rem}
.badge b{display:block;color:#fff;font-size:1.05rem;margin-bottom:2px}
.diff{background:var(--navy);color:#fff}
.diff .kicker{color:#8DB6FF}.diff .kicker::before{background:#8DB6FF}
.diff .sec-head p{color:#C5D3EA}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.gallery figure{margin:0;min-width:0}
.gallery img{width:100%;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.gallery figcaption{margin-top:14px;font-size:.92rem;color:#8DB6FF;font-weight:500}
/*x*/.about-img{width:100%;max-width:380px;border-radius:22px;box-shadow:0 20px 50px rgba(7,30,61,.18)}

.monogram{width:150px;height:150px;border-radius:28px;background:var(--navy);display:grid;place-items:center}
.monogram img{width:96px}
.about h2{font-size:clamp(1.6rem,2.8vw,2.2rem);margin-top:14px}
.about p{margin-top:14px;color:var(--ink-2);max-width:62ch}
.about .sign{margin-top:22px;font-weight:600}
.about .sign span{display:block;font-weight:400;color:var(--muted);font-size:.93rem}

.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:22px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--blue);font-weight:500;font-size:1.4rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:12px;color:var(--ink-2)}

.contact{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.contact::after{content:"";position:absolute;left:-200px;bottom:-320px;width:640px;height:640px;border-radius:50%;border:1px solid rgba(141,182,255,.25)}
.contact-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:start}
.contact .kicker{color:#8DB6FF}.contact .kicker::before{background:#8DB6FF}
.contact h2{font-size:clamp(1.9rem,3.4vw,2.7rem);margin-top:16px}
.contact .intro p{color:#C5D3EA;margin-top:16px;font-size:1.06rem}
.direct{margin-top:30px;display:grid;gap:12px}
.direct a,.direct div{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:500}
.direct svg{width:20px;height:20px;fill:none;stroke:#8DB6FF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
form{background:#fff;color:var(--ink);border-radius:22px;padding:30px;display:grid;gap:16px;min-width:0}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:6px;font-size:.88rem;font-weight:600;color:var(--ink-2)}
input,select,textarea{font:inherit;color:var(--ink);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
textarea{min-height:96px;resize:vertical}
form .btn{width:100%;margin-top:4px}
form .small{font-size:.82rem;color:var(--muted);text-align:center}

footer{background:#06152B;color:#8A9BB5;font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-block:28px}
footer .fb{color:inherit;text-decoration:none;white-space:nowrap}
footer .fb svg{vertical-align:-3px;margin-right:5px}
footer .fb:hover{color:#fff}
footer .links{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
footer .links a{color:inherit}
footer img{height:16px;width:auto;opacity:.9}

@media (max-width:900px){
  .nav ul{display:none}
  .hero-grid,.free,.contact-grid{grid-template-columns:1fr}
  .hero-grid{padding-block:44px 64px;gap:28px}
  .chat{position:relative;width:100%;top:0}
  .journey{display:none}
  .areas,.steps{grid-template-columns:1fr}
  .card.wide{grid-column:auto;flex-direction:column;align-items:flex-start}
  .about{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr 1fr}
  .sky{height:90px}
  .band{min-height:360px}
  .band::after{background:linear-gradient(180deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.75) 55%,rgba(255,255,255,.2) 100%)}
  .band img{object-position:70% center}
  section{padding-block:72px}
}
@media (max-width:520px){
  .timeline{grid-template-columns:1fr}
  form .two{grid-template-columns:1fr}
  .nav .btn{padding:9px 14px;font-size:.84rem}
  .nav .logo img{height:26px}
  .hero .actions .btn{width:100%}
}
</style>
<style>

</style>
